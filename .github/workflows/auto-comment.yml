name: Auto Comment

on: [issues, pull_request]

permissions:
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/auto-comment@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          issuesOpened: >
            👋 @{{ author }}
            
            Issues is only for reporting a bug/feature request. For limited support, questions, and discussions, please join [MobInspect Slack channel](https://join.slack.com/t/mobinspect/shared_invite/zt-3ephptj6c-OuDMatJ9z9MT0T_Vb~l2pg)
            
            Please include all the requested and relevant information when opening a bug report. Improper reports will be closed without any response.

          pullRequestOpened: >
            👋 @{{ author }}
            
            Thank you for sending this pull request ❤️.
            
            Please make sure you have followed our [contribution guidelines](https://github.com/MobInspect/mobinspect/blob/master/.github/CONTRIBUTING.md). We will review it as soon as possible
