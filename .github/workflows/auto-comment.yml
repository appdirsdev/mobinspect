name: Auto Comment

on: [issues, pull_request]

permissions:
  issues: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: wow-actions/auto-comment@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          issuesOpened: >
            👋 @{{ author }}
            
            Issues is only for reporting a bug/feature request. For questions and discussions, please use [GitHub Discussions](https://github.com/appdirsdev/mobinspect/discussions)
            
            Please include all the requested and relevant information when opening a bug report. Improper reports will be closed without any response.

          pullRequestOpened: >
            👋 @{{ author }}
            
            Thank you for sending this pull request ❤️.
            
            Please make sure you have followed our [contribution guidelines](https://github.com/appdirsdev/mobinspect/blob/main/.github/CONTRIBUTING.md). We will review it as soon as possible
