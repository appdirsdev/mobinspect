[Service]
# soft memory ceiling (throttle, never hard-kill a legit request) + prefer this
# process over PostgreSQL when the kernel must OOM-pick
MemoryHigh=1500M
OOMScoreAdjust=200
# conservative sandbox: scanner forks jadx(JVM JIT needs W+X)/apktool/adb and
# writes to $HOME,/run,/tmp — so keep PrivateTmp/SystemCallFilter OFF, apply the safe subset
NoNewPrivileges=yes
ProtectSystem=full
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
