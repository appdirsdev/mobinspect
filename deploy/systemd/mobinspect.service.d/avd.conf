[Service]
# Wire the dynamic-analysis target + adb path used by mobsf.MobSF.utils.get_adb().
# Both are read by mobsf/MobSF/settings.py from env (no patching of ~/.MobInspect/config.py),
# which keeps the dynamic-analysis config scoped to this systemd unit and avoids
# the gunicorn-boot-hang we hit when ANALYZER_IDENTIFIER was set in config.py.
#
# Without MOBINSPECT_ADB_BINARY, the Prepare-runtime flow falls into get_adb()'s
# proc-scan fallback (find_process_by('adb')) which raises PermissionError reading
# other users' /proc/*/exe and ultimately returns None — surfaced in the UI as:
# "argument should be a str or an os.PathLike object … not 'NoneType'".
#
# MOBINSPECT_ASYNC_ANALYSIS=1 enables django-q2 task queuing so static/dynamic
# scans return immediately from the HTTP request and run in the background
# (this is also the settings.py default now, so the line below is belt-and-
# braces). The worker (mobinspect-worker.service) MUST also have this flag
# set — it already does in its unit file — otherwise queued tasks land in the
# broker but never execute, and the UI sits at "Scanning…" forever. Keep both
# sides in sync when toggling.
Environment=ANALYZER_IDENTIFIER=emulator-5554
Environment=MOBINSPECT_ADB_BINARY=/home/ubuntu/android-sdk/platform-tools/adb
Environment=MOBINSPECT_ASYNC_ANALYSIS=1
