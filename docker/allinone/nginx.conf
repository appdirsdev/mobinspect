user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 550M;
    proxy_redirect off;
    proxy_buffering on;

    upstream mobinspect_web {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://mobinspect_web;
            proxy_read_timeout 900;
            client_max_body_size 550M;
        }
    }
    # NOTE: no `listen 1337` block here. The dynamic-analysis capture proxy
    # (httptools) binds :1337 directly when DA is in use; an nginx server that
    # both listened on 1337 AND proxy_pass'd to 127.0.0.1:1337 was a self-loop
    # that also stole the port from httptools (EADDRINUSE). EXPOSE 1337 remains
    # for that direct bind.
}
