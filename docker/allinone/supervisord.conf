[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/local/bin/run-postgres.sh
priority=10
autostart=true
autorestart=true
stopsignal=INT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ollama]
command=/usr/local/bin/run-ollama.sh
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:django-init]
command=/usr/local/bin/run-django-init.sh
priority=30
autostart=true
# One-shot: a clean exit 0 means migrations succeeded — do NOT rerun it (that
# would re-migrate on every successful boot). Any NON-zero exit (Postgres not
# ready in time, transient migrate failure) is "unexpected", so supervisord
# reruns it until it succeeds. Without this, a single transient failure leaves
# the .migrated marker absent and django-web/django-worker (which block on that
# marker) restart-loop forever — the container never self-heals.
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:django-web]
command=/usr/local/bin/run-web.sh
priority=40
autostart=true
autorestart=true
user=mobinspect
environment=HOME="/home/mobinspect"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:django-worker]
command=/usr/local/bin/run-worker.sh
priority=41
autostart=true
autorestart=true
user=mobinspect
environment=HOME="/home/mobinspect"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=50
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
