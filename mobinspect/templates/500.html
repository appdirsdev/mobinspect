<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>500 · MobInspect</title>
  <style>
    /* Inline so the 500 page works even when CSS/static is unreachable. */
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:#0B0F1A; color:#F1F5F9; min-height:100vh; display:flex;
           align-items:center; justify-content:center; padding:48px 16px; }
    .box { max-width:480px; text-align:center; }
    .icon { display:inline-flex; align-items:center; justify-content:center;
            width:56px; height:56px; border-radius:14px;
            background:rgba(220,38,38,0.15); color:#F87171; margin-bottom:16px;
            font-size:28px; }
    h1 { font-size:48px; line-height:1.1; margin:0 0 8px; font-weight:700; }
    h2 { font-size:20px; line-height:1.3; margin:0 0 12px; font-weight:600; }
    p  { color:#94A3B8; margin:0 0 24px; line-height:1.5; }
    a  { color:#F1F5F9; background:#2563EB; padding:10px 20px; border-radius:6px;
         text-decoration:none; font-weight:500; }
    @media (prefers-color-scheme: light) {
      body { background:#FFFFFF; color:#0F172A; }
      p    { color:#475569; }
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="icon">!</span>
    <h1>500</h1>
    <h2>Something went wrong on our end</h2>
    <p>A server error occurred. Please try again in a moment. If the issue persists, contact your administrator.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
