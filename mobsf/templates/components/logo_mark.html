{% comment %}
  MobInspect brand mark — a security shield being inspected by a magnifier
  (with a verified check). Self-contained (own gradient tile), so it sits on
  any background. Pass a Tailwind size via `cls`, e.g.
  {% include "components/logo_mark.html" with cls="w-8 h-8" %}
{% endcomment %}
<svg viewBox="0 0 64 64" fill="none" class="{{ cls|default:'w-full h-full' }} block" role="img" aria-label="MobInspect logo">
  <defs>
    <linearGradient id="mimarkTile" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F8DF9"/><stop offset="1" stop-color="#1B3AAE"/>
    </linearGradient>
    <linearGradient id="mimarkShield" x1="32" y1="11" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#D3E2FF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#mimarkTile)"/>
  <path d="M0 16A16 16 0 0 1 16 0H48A16 16 0 0 1 64 16V21H0Z" fill="#fff" opacity="0.08"/>
  <path d="M32 11.5c4.6 2 9 3 14 3.2v13.1c0 9.7-5.7 16.6-14 20.7-8.3-4.1-14-11-14-20.7V14.7c5-.2 9.4-1.2 14-3.2Z" fill="url(#mimarkShield)"/>
  <circle cx="29.5" cy="27" r="8" stroke="#2456D6" stroke-width="3.1"/>
  <path d="M35.4 33l6.4 6.4" stroke="#2456D6" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M26 27.2l2.7 2.7 4.7-5.2" stroke="#12C8A6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
