{% load mi_icons %}{% load static %}
<a
  href="{% url url %}"
  class="mi-nav-item group flex items-center gap-3 px-2.5 h-10 rounded-lg text-small font-medium text-text-secondary hover:text-text-primary {% if active %}is-active{% endif %}"
  :class="sidebarCollapsed ? 'justify-center !px-0' : ''"
  aria-current="{% if active %}page{% else %}false{% endif %}"
  title="{{ label }}"
>
  <span class="mi-nav-ico flex-shrink-0">{% icon icon size=18 %}</span>
  <span x-show="!sidebarCollapsed" x-transition.opacity class="truncate">{{ label }}</span>
</a>
