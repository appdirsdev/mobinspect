{% load mi_icons %}
{% comment %}
  Reusable finding group for the AppSec dashboard.
  Vars: items (list with .title, .section, .description), level (severity token), label
{% endcomment %}
{% if items %}
  <div class="space-y-2">
    {% for item in items %}
      <div class="card" data-reveal>
        <button
          type="button"
          class="w-full flex items-center justify-between gap-3 px-5 py-3 text-left hover:bg-surface-2/40 transition-colors duration-fast"
          @click="open = (open === '{{ level }}-{{ forloop.counter }}' ? '' : '{{ level }}-{{ forloop.counter }}')"
        >
          <div class="flex items-center gap-3 min-w-0">
            <span class="badge badge-{{ level }}">{{ label }}</span>
            <span class="text-text-primary font-medium truncate">{{ item.title }}</span>
          </div>
          <div class="flex items-center gap-3 flex-shrink-0">
            <span class="text-tiny uppercase text-text-tertiary hidden sm:inline">{{ item.section }}</span>
            <span class="text-text-tertiary transition-transform duration-fast"
                  :class="open === '{{ level }}-{{ forloop.counter }}' ? 'rotate-180' : ''">
              {% icon "chevron-down" size=16 %}
            </span>
          </div>
        </button>
        <div
          x-show="open === '{{ level }}-{{ forloop.counter }}'"
          x-cloak
          x-transition:enter="transition ease-out duration-base"
          x-transition:enter-start="opacity-0 max-h-0"
          x-transition:enter-end="opacity-100 max-h-[1000px]"
          class="px-5 pb-4 border-t border-border-subtle"
        >
          <pre class="pre-finding text-text-secondary mt-3">{{ item.description }}</pre>
        </div>
      </div>
    {% endfor %}
  </div>
{% endif %}
